<!doctype html>
<html lang="zh-CN" data-theme="dark">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>MusicFox GUI</title>
        <style>
            :root {
                --bg-app: #1e1e20;
                --bg-panel: #18181a;
                --bg-inactive: #2b2b2e;
                --bg-inactive-hover: #3a3a3e;
                --bg-cover: #3a3a3e;
                --bg-track: #3a3a3e;
                --color-inactive: #a0a0a5;
                --color-active: #c82947;
                --color-white: #ffffff;
                --color-title: #ffffff;
                --color-secondary: #d1d1d6;
                --color-line-hover-bg: #242428;
                --popup-bg: #232327;
                --shadow-pop: 0 8px 24px rgba(0, 0, 0, 0.45);
                --scroll-thumb: #3a3a3e;
                --win-hover: rgba(255, 255, 255, 0.12);
                --ripple: rgba(255, 255, 255, 0.35);
            }

            html[data-theme="light"] {
                --bg-app: #f4f4f6;
                --bg-panel: #e9e9ec;
                --bg-inactive: #e4e4e8;
                --bg-inactive-hover: #d4d4da;
                --bg-cover: #dcdce1;
                --bg-track: #d0d0d6;
                --color-inactive: #808088;
                --color-active: #c82947;
                --color-white: #ffffff;
                --color-title: #1c1c1e;
                --color-secondary: #3c3c42;
                --color-line-hover-bg: #eaecef;
                --popup-bg: #ffffff;
                --shadow-pop: 0 8px 24px rgba(0, 0, 0, 0.18);
                --scroll-thumb: #c6c6cc;
                --win-hover: rgba(0, 0, 0, 0.08);
                --ripple: rgba(0, 0, 0, 0.16);
            }

            * {
                box-sizing: border-box;
                margin: 0;
                padding: 0;
                user-select: none;
                -webkit-font-smoothing: antialiased;
            }

            html,
            body {
                height: 100%;
                overflow: hidden;
            }

            body {
                background-color: var(--bg-app);
                color: var(--color-title);
                font-family:
                    -apple-system, BlinkMacSystemFont, "Segoe UI",
                    "Microsoft YaHei UI", "Microsoft YaHei", Roboto, sans-serif;
                display: flex;
                flex-direction: column;
                height: 100vh;
                overflow: hidden;
                transition:
                    background-color 0.2s,
                    color 0.2s;
            }

            svg {
                fill: currentColor;
                flex-shrink: 0;
                pointer-events: none;
            }

            .hidden {
                display: none !important;
            }

            ::-webkit-scrollbar {
                width: 8px;
                height: 8px;
            }
            ::-webkit-scrollbar-thumb {
                background-color: var(--scroll-thumb);
                border-radius: 4px;
            }
            ::-webkit-scrollbar-track {
                background: transparent;
            }

            /* ================= 舞台 ================= */
            .stage {
                position: relative;
                flex: 1;
                display: flex;
                flex-direction: column;
                overflow: hidden;
                min-height: 0;
            }

            .app-container {
                display: flex;
                flex: 1;
                overflow: hidden;
                min-height: 0;
            }

            .sidebar {
                width: 60px;
                display: flex;
                flex-direction: column;
                align-items: center;
                padding-top: 15px;
                padding-bottom: 15px;
                gap: 10px;
                position: relative;
                z-index: 10;
                background-color: var(--bg-app);
            }

            .nav-item {
                position: relative;
                width: 42px;
                height: 42px;
                display: flex;
                align-items: center;
                cursor: pointer;
            }

            .spacer {
                flex: 1;
            }

            .icon-box {
                position: relative;
                width: 42px;
                height: 42px;
                background-color: var(--bg-inactive);
                border-radius: 4px;
                display: flex;
                align-items: center;
                justify-content: center;
                color: var(--color-inactive);
                z-index: 2;
                flex-shrink: 0;
                overflow: hidden;
            }

            .icon-box svg {
                width: 20px;
                height: 20px;
            }

            .nav-item:hover .icon-box,
            .nav-item:hover .label {
                background-color: var(--color-active);
                color: var(--color-white);
            }

            .nav-item.active .icon-box,
            .nav-item.active .label {
                background-color: var(--color-active);
                color: var(--color-white);
            }

            .indicator {
                position: absolute;
                left: -9px;
                width: 4px;
                background-color: var(--color-active);
                border-radius: 4px;
                top: 50%;
                transform: translateY(-50%);
                height: 0;
                display: none;
            }

            .nav-item.active .indicator {
                display: block;
                animation: extendLine 0.1s ease-out forwards;
            }

            @keyframes extendLine {
                from {
                    height: 12.6px;
                }
                to {
                    height: 29.4px;
                }
            }

            .label-wrapper {
                position: absolute;
                left: 47px;
                height: 42px;
                overflow: hidden;
                width: 0;
                transition: width 0.1s ease-out;
                z-index: 3;
                pointer-events: none;
            }

            .nav-item:hover .label-wrapper {
                width: 136px;
            }

            .label {
                width: 100%;
                height: 42px;
                background-color: var(--color-active);
                color: var(--color-white);
                font-size: 16px;
                font-weight: 600;
                display: flex;
                align-items: center;
                justify-content: center;
                padding: 0 12px;
                border-radius: 4px;
                white-space: nowrap;
                text-align: center;
            }

            /* ---- 主内容 ---- */
            .main-content {
                flex: 1;
                padding: 20px 24px;
                display: flex;
                flex-direction: column;
                gap: 20px;
                min-width: 0;
                min-height: 0;
                background-color: var(--bg-app);
            }

            /* 经典搜索栏：扁平填充、4px 小圆角、无描边 */
            .search-bar {
                display: flex;
                align-items: center;
                background-color: var(--bg-inactive);
                border-radius: 4px;
                padding: 4px 4px 4px 12px;
                width: 100%;
                max-width: 520px;
                flex-shrink: 0;
                color: var(--color-inactive);
                gap: 4px;
            }

            .search-bar > svg {
                width: 16px;
                height: 16px;
                flex-shrink: 0;
            }

            .search-bar input {
                background: transparent;
                border: none;
                outline: none;
                color: var(--color-title);
                margin-left: 8px;
                width: 100%;
                min-width: 60px;
                font-size: 14px;
                font-family: inherit;
                user-select: text;
            }

            .search-bar input::placeholder {
                color: var(--color-inactive);
            }

            .clear-btn {
                display: flex;
                align-items: center;
                justify-content: center;
                width: 24px;
                height: 24px;
                border-radius: 4px;
                color: var(--color-inactive);
                cursor: pointer;
                flex-shrink: 0;
                border: none;
                background: transparent;
            }

            .clear-btn:hover {
                background-color: var(--bg-inactive-hover);
                color: var(--color-title);
            }

            .clear-btn svg {
                width: 14px;
                height: 14px;
            }

            .search-btn {
                border: none;
                background-color: var(--color-active);
                color: var(--color-white);
                font-family: inherit;
                font-size: 13px;
                height: 28px;
                padding: 0 16px;
                border-radius: 4px;
                cursor: pointer;
                flex-shrink: 0;
            }

            .search-btn:hover {
                filter: brightness(1.08);
            }

            .browse-area {
                display: flex;
                flex-direction: column;
                gap: 12px;
                flex-shrink: 0;
            }

            .section-title {
                font-size: 16px;
                color: var(--color-inactive);
            }

            .tag-list {
                display: flex;
                gap: 10px;
                flex-wrap: wrap;
            }

            .tag {
                position: relative;
                overflow: hidden;
                background-color: var(--bg-inactive);
                padding: 6px 12px;
                border-radius: 4px;
                font-size: 13px;
                color: var(--color-secondary);
                cursor: pointer;
            }

            .tag:hover {
                background-color: var(--bg-inactive-hover);
            }

            /* 历史搜索：标题行 + 可删除的搜索词 */
            .section-head {
                display: flex;
                align-items: center;
                justify-content: space-between;
                gap: 10px;
            }

            .hist-clear {
                border: none;
                background: transparent;
                color: var(--color-inactive);
                font-size: 12px;
                font-family: inherit;
                cursor: pointer;
                padding: 4px 8px;
                border-radius: 4px;
            }

            .hist-clear:hover {
                color: var(--color-active);
                background-color: var(--bg-inactive-hover);
            }

            .hist-empty {
                color: var(--color-inactive);
                font-size: 13px;
                padding: 10px 4px;
            }

            .tag {
                position: relative;
                overflow: hidden;
                background-color: var(--bg-inactive);
                padding: 6px 8px 6px 12px;
                border-radius: 4px;
                font-size: 13px;
                color: var(--color-secondary);
                cursor: pointer;
                display: flex;
                align-items: center;
                gap: 4px;
                border: none;
                font-family: inherit;
            }

            .tag-x {
                border: none;
                background: transparent;
                color: inherit;
                opacity: 0.5;
                cursor: pointer;
                display: flex;
                align-items: center;
                justify-content: center;
                width: 18px;
                height: 18px;
                border-radius: 3px;
                flex-shrink: 0;
            }

            .tag-x:hover {
                opacity: 1;
                background-color: rgba(128, 128, 128, 0.25);
                color: var(--color-active);
            }

            .tag-x svg {
                width: 11px;
                height: 11px;
            }

            .result-panel {
                flex: 1;
                min-height: 0;
                display: flex;
                flex-direction: column;
                gap: 10px;
            }

            .result-header {
                display: flex;
                align-items: baseline;
                justify-content: space-between;
            }

            .result-count {
                font-size: 13px;
                color: var(--color-inactive);
            }

            .list-scroll {
                flex: 1;
                min-height: 0;
                overflow-y: auto;
                padding-right: 4px;
                margin-right: -4px;
            }

            .track-row {
                position: relative;
                overflow: hidden;
                display: grid;
                grid-template-columns:
                    34px minmax(0, 1.6fr) minmax(0, 1fr)
                    minmax(0, 1.2fr) 54px;
                align-items: center;
                gap: 12px;
                padding: 8px 10px;
                border-radius: 4px;
                cursor: pointer;
                font-size: 13px;
            }

            .track-row:hover {
                background-color: var(--color-line-hover-bg);
            }

            .col-index {
                color: var(--color-inactive);
                font-size: 13px;
                display: flex;
                align-items: center;
                justify-content: center;
            }

            .col-index svg {
                width: 14px;
                height: 14px;
            }

            .col-title {
                color: var(--color-title);
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
            }

            .col-artist,
            .col-album {
                color: var(--color-inactive);
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
            }

            .col-duration {
                color: var(--color-inactive);
                font-size: 12px;
                text-align: right;
                font-variant-numeric: tabular-nums;
            }

            .track-row.playing .col-title,
            .track-row.playing .col-index {
                color: var(--color-active);
            }

            .empty-state {
                flex: 1;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                gap: 8px;
                color: var(--color-inactive);
            }

            .empty-state svg {
                width: 52px;
                height: 52px;
                opacity: 0.4;
            }

            .empty-title {
                font-size: 14px;
                color: var(--color-secondary);
            }

            .empty-sub {
                font-size: 12px;
                color: var(--color-inactive);
            }

            /* ---- 歌词覆盖层（UWP 风格滑入：速度适中、先淡后现） ---- */
            .lyrics-page {
                position: absolute;
                inset: 0;
                z-index: 15;
                display: flex;
                flex-direction: column;
                background-color: var(--bg-app);
                opacity: 1;
                transform: translateY(0);
                transition:
                    transform 0.22s cubic-bezier(0.1, 0.9, 0.2, 1),
                    opacity 0.22s cubic-bezier(0.1, 0.9, 0.2, 1);
            }

            .lyrics-page.collapsed {
                transform: translateY(100%);
                opacity: 0;
                pointer-events: none;
            }

            .top-bar {
                height: 56px;
                display: flex;
                align-items: center;
                justify-content: flex-end;
                padding: 0 20px;
                flex-shrink: 0;
                gap: 8px;
            }

            .btn-square {
                position: relative;
                width: 36px;
                height: 36px;
                background-color: var(--bg-inactive);
                border-radius: 4px;
                display: flex;
                align-items: center;
                justify-content: center;
                color: var(--color-inactive);
                cursor: pointer;
                overflow: hidden;
                flex-shrink: 0;
                border: none;
                font-family: inherit;
                transition:
                    background-color 0.1s,
                    color 0.1s;
            }

            .btn-square svg {
                width: 18px;
                height: 18px;
            }

            .btn-square:hover,
            .btn-square:active {
                background-color: var(--color-active);
                color: var(--color-white);
            }

            /* 程序化瞬时按压态（先应用按钮状态，再执行逻辑的视觉反馈） */
            .btn-square.active {
                background-color: var(--color-active);
                color: var(--color-white);
            }

            .btn-square:disabled {
                opacity: 0.45;
                cursor: default;
                background-color: var(--bg-inactive);
                color: var(--color-inactive);
            }

            .lyrics-content {
                flex: 1;
                min-height: 0;
                display: flex;
                flex-direction: column;
                align-items: center;
                overflow-y: auto;
                scrollbar-width: none;
                overscroll-behavior: contain;
            }

            .lyrics-content::-webkit-scrollbar {
                display: none;
            }

            .lyric-line {
                font-size: 17px;
                line-height: 1.6;
                color: var(--color-inactive);
                padding: 8px 18px;
                border-radius: 4px;
                cursor: pointer;
                text-align: center;
                margin: 4px 0;
                transition:
                    color 0.15s,
                    background-color 0.15s,
                    font-size 0.2s cubic-bezier(0.1, 0.9, 0.2, 1),
                    opacity 0.3s;
            }

            .lyric-line .lyric-trans {
                font-size: 13px;
                opacity: 0.75;
                margin-top: 3px;
            }

            .lyric-line:hover {
                background-color: var(--bg-inactive);
                color: var(--color-title);
            }

            .lyric-line.active {
                font-size: 22px;
                font-weight: 600;
                color: var(--color-white);
                background-color: var(--color-active);
            }

            .lyric-line.active:hover {
                color: var(--color-white);
            }

            .lyric-line.active .lyric-trans {
                opacity: 0.85;
            }

            /* 歌词行入场：轻微上浮淡入（UWP 内容转场，速度适中） */
            @keyframes lyricPop {
                from {
                    opacity: 0;
                    transform: translateY(14px);
                }
                to {
                    opacity: 1;
                    transform: translateY(0);
                }
            }

            .lyric-line.lyric-pop {
                animation: lyricPop 0.3s cubic-bezier(0.1, 0.9, 0.2, 1)
                    backwards;
            }

            @keyframes fadeUpIn {
                from {
                    opacity: 0;
                    transform: translateY(10px);
                }
                to {
                    opacity: 1;
                    transform: translateY(0);
                }
            }

            .song-header {
                text-align: center;
                margin-bottom: 14px;
                flex-shrink: 0;
                animation: fadeUpIn 0.3s cubic-bezier(0.1, 0.9, 0.2, 1)
                    backwards;
            }

            .song-header .title {
                font-size: 22px;
                font-weight: 600;
                color: var(--color-title);
                margin-bottom: 5px;
            }

            .song-header .artist {
                font-size: 15px;
                color: var(--color-inactive);
            }

            .lyric-placeholder {
                margin: auto;
                display: flex;
                flex-direction: column;
                align-items: center;
                gap: 14px;
                color: var(--color-inactive);
                font-size: 14px;
            }

            .lyric-placeholder svg {
                width: 60px;
                height: 60px;
                opacity: 0.4;
            }

            /* ================= 底部播放栏 ================= */
            .player-bar {
                height: 60px;
                background-color: var(--bg-panel);
                display: flex;
                align-items: center;
                position: relative;
                flex-shrink: 0;
                user-select: none;
                z-index: 20;
            }

            .progress-container {
                position: absolute;
                top: 0;
                left: 0;
                width: 100%;
                height: 4px;
                background-color: var(--bg-inactive);
                cursor: pointer;
                transform: translateY(-100%);
                transition: height 0.1s ease-out;
                z-index: 5;
            }

            .player-bar:hover .progress-container {
                height: 8px;
            }

            .progress-track {
                width: 100%;
                height: 100%;
                position: relative;
                display: flex;
                align-items: center;
            }

            .progress-track.disabled {
                cursor: default;
            }

            .progress-fill {
                width: 0%;
                height: 100%;
                background-color: var(--color-active);
                flex-shrink: 0;
            }

            .progress-handle {
                width: 6px;
                height: 100%;
                background-color: var(--color-active);
                display: none;
                flex-shrink: 0;
                transition: height 0.1s ease-out;
            }

            .player-bar:hover .progress-handle {
                display: block;
                height: 14px;
            }

            .progress-tip {
                position: absolute;
                bottom: 100%;
                margin-bottom: 8px;
                transform: translateX(-50%);
                background-color: var(--popup-bg);
                color: var(--color-title);
                font-size: 11px;
                padding: 3px 8px;
                border-radius: 4px;
                box-shadow: var(--shadow-pop);
                pointer-events: none;
                white-space: nowrap;
                font-variant-numeric: tabular-nums;
                opacity: 0;
                transition: opacity 0.08s;
            }

            .progress-container:hover .progress-tip {
                opacity: 1;
            }

            .controls-container {
                position: relative;
                display: flex;
                align-items: center;
                justify-content: space-between;
                padding: 0 16px;
                width: 100%;
                height: 100%;
                gap: 12px;
            }

            .song-info-btn {
                display: flex;
                align-items: center;
                gap: 10px;
                background-color: var(--bg-inactive);
                border-radius: 4px;
                padding: 4px 12px 4px 4px;
                cursor: pointer;
                position: relative;
                overflow: hidden;
                height: 40px;
                max-width: 250px;
                min-width: 0;
                border: none;
                font-family: inherit;
                color: var(--color-inactive);
                transition:
                    background-color 0.1s,
                    color 0.1s;
            }

            .song-cover {
                width: 32px;
                height: 32px;
                background-color: var(--bg-cover);
                border-radius: 2px;
                display: flex;
                align-items: center;
                justify-content: center;
                flex-shrink: 0;
                color: var(--color-inactive);
                overflow: hidden;
            }

            .song-cover svg {
                width: 16px;
                height: 16px;
            }

            .song-cover img {
                width: 100%;
                height: 100%;
                object-fit: cover;
            }

            .song-detail {
                display: flex;
                flex-direction: column;
                justify-content: center;
                min-width: 0;
            }

            .song-title {
                font-size: 13px;
                font-weight: 500;
                color: var(--color-title);
                line-height: 1.2;
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
            }

            .song-artist {
                font-size: 11px;
                color: var(--color-inactive);
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
            }

            .song-info-btn:hover {
                background-color: var(--color-active);
            }

            .song-info-btn:hover .song-cover {
                background-color: rgba(255, 255, 255, 0.16);
                color: var(--color-white);
            }

            .song-info-btn:hover .song-title {
                color: var(--color-white);
            }

            .song-info-btn:hover .song-artist {
                color: rgba(255, 255, 255, 0.8);
            }

            /* 左侧歌曲区不参与中间/右侧定位，改动宽度不影响布局 */
            .left-info {
                position: relative;
                min-width: 0;
                display: flex;
                justify-content: flex-start;
            }

            .center-controls {
                position: absolute;
                left: 50%;
                top: 50%;
                transform: translate(-50%, -50%);
                display: flex;
                align-items: center;
                gap: 8px;
            }

            .right-controls {
                position: absolute;
                right: 16px;
                top: 50%;
                transform: translateY(-50%);
                display: flex;
                align-items: center;
                gap: 8px;
            }

            .queue-wrap {
                position: relative;
                display: flex;
                align-items: center;
            }

            .queue-badge {
                position: absolute;
                top: -6px;
                right: -6px;
                min-width: 16px;
                height: 16px;
                padding: 0 4px;
                border-radius: 8px;
                background-color: var(--color-active);
                color: var(--color-white);
                font-size: 10px;
                line-height: 16px;
                text-align: center;
                font-variant-numeric: tabular-nums;
            }

            .volume-box {
                display: flex;
                align-items: center;
                height: 36px;
                background-color: var(--bg-inactive);
                border-radius: 4px;
                padding: 0 10px 0 0;
                gap: 6px;
                position: relative;
                overflow: hidden;
            }

            .volume-btn {
                width: 36px;
                height: 36px;
                display: flex;
                align-items: center;
                justify-content: center;
                color: var(--color-inactive);
                cursor: pointer;
                position: relative;
                overflow: hidden;
                border-radius: 4px;
                border: none;
                background: transparent;
            }

            .volume-btn svg {
                width: 18px;
                height: 18px;
            }

            .volume-btn:hover {
                background-color: var(--color-active);
                color: var(--color-white);
            }

            .volume-bar {
                width: 70px;
                height: 4px;
                background-color: var(--bg-track);
                cursor: pointer;
                position: relative;
                display: flex;
                align-items: center;
            }

            .volume-fill {
                width: 60%;
                height: 100%;
                background-color: var(--color-active);
            }

            .volume-handle {
                width: 4px;
                height: 100%;
                background-color: var(--color-active);
                flex-shrink: 0;
            }

            /* ---- 播放列表弹层 ---- */
            .queue-pop {
                position: absolute;
                bottom: calc(100% + 10px);
                right: 0;
                width: 320px;
                max-height: 380px;
                background-color: var(--popup-bg);
                border-radius: 8px;
                box-shadow: var(--shadow-pop);
                display: flex;
                flex-direction: column;
                overflow: hidden;
                z-index: 30;
            }

            .queue-header {
                display: flex;
                align-items: center;
                justify-content: space-between;
                padding: 12px 14px 8px;
                font-size: 13px;
                font-weight: 600;
                color: var(--color-title);
            }

            .queue-close {
                cursor: pointer;
                color: var(--color-inactive);
                display: flex;
                align-items: center;
                justify-content: center;
                width: 26px;
                height: 26px;
                border-radius: 4px;
            }

            .queue-close:hover {
                background-color: var(--bg-inactive);
                color: var(--color-title);
            }

            .queue-close svg {
                width: 14px;
                height: 14px;
            }

            .queue-list {
                overflow-y: auto;
                padding: 0 6px 8px;
            }

            .queue-item {
                display: flex;
                flex-direction: column;
                gap: 2px;
                padding: 8px 10px;
                border-radius: 4px;
                cursor: pointer;
                min-width: 0;
                position: relative;
                overflow: hidden;
            }

            .queue-item:hover {
                background-color: var(--bg-inactive);
            }

            .queue-item.active .q-title {
                color: var(--color-active);
            }

            .q-title {
                font-size: 13px;
                color: var(--color-title);
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
            }

            .q-artist {
                font-size: 11px;
                color: var(--color-inactive);
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
            }

            .queue-empty {
                padding: 24px 10px;
                text-align: center;
                font-size: 12px;
                color: var(--color-inactive);
            }

            .snackbar {
                position: absolute;
                left: 50%;
                bottom: calc(100% + 14px);
                transform: translateX(-50%);
                background-color: var(--popup-bg);
                color: var(--color-title);
                font-size: 13px;
                padding: 8px 16px;
                border-radius: 4px;
                box-shadow: var(--shadow-pop);
                z-index: 40;
                white-space: nowrap;
                max-width: 70vw;
                overflow: hidden;
                text-overflow: ellipsis;
                pointer-events: none;
            }

            .snackbar.err {
                color: var(--color-white);
                background-color: var(--color-active);
            }

            /* ================= 转场动画（UWP 风格，速度适宜） ================= */
            .result-panel,
            .browse-area {
                animation: panelIn 0.2s cubic-bezier(0.1, 0.9, 0.2, 1);
            }

            @keyframes panelIn {
                from {
                    opacity: 0;
                    transform: translateY(8px);
                }
                to {
                    opacity: 1;
                    transform: translateY(0);
                }
            }

            .queue-pop {
                transform-origin: 100% 100%;
                animation: popIn 0.16s cubic-bezier(0.1, 0.9, 0.2, 1);
            }

            @keyframes popIn {
                from {
                    opacity: 0;
                    transform: scale(0.94);
                }
                to {
                    opacity: 1;
                    transform: scale(1);
                }
            }

            /* ================= 歌词活动矩形（square.lua 同款四边缓动算法，见 app.js） ================= */
            .lyrics-content {
                position: relative;
            }

            .lyric-line {
                position: relative;
                z-index: 1;
            }

            .lyric-line:hover {
                background-color: transparent;
                color: var(--color-title);
            }

            .lyric-line.active {
                background-color: transparent;
            }

            .lyric-line.active:hover {
                background-color: transparent;
                color: var(--color-white);
            }

            .lrc-rect {
                position: absolute;
                z-index: 0;
                background-color: var(--color-active);
                border-radius: 6px;
                opacity: 0;
                pointer-events: none;
            }

            .lyric-note {
                margin: auto;
                display: flex;
                flex-direction: column;
                align-items: center;
                gap: 10px;
                color: var(--color-inactive);
                font-size: 16px;
                text-align: center;
                padding-bottom: 60px;
            }

            /* ================= 滑块圆角与点击热区 ================= */
            .progress-fill,
            .volume-fill {
                border-radius: 2px;
            }

            .progress-handle {
                border-radius: 999px;
            }

            .volume-handle {
                width: 5px;
                border-radius: 999px;
                transition: height 0.1s ease-out;
            }

            .volume-box:hover .volume-handle {
                height: 12px;
            }

            .volume-bar::before {
                content: "";
                position: absolute;
                top: -14px;
                bottom: -14px;
                left: -8px;
                right: -8px;
            }

            /* ================= 窄窗口适配（最小 400x300） ================= */
            @media (max-width: 700px) {
                .center-controls {
                    gap: 4px;
                }
                .btn-square {
                    width: 32px;
                    height: 32px;
                }
                .song-info-btn {
                    padding-right: 8px;
                }
                .song-detail {
                    display: none;
                }
                .volume-bar {
                    display: none;
                }
                .volume-box {
                    padding: 0;
                }
                .track-row {
                    grid-template-columns:
                        28px minmax(0, 1.7fr) minmax(0, 1fr)
                        42px;
                }
                .track-row .col-album {
                    display: none;
                }
                .main-content {
                    padding: 14px 16px;
                }
                .sidebar {
                    width: 52px;
                }
            }
            /* ================= 搜索分类 + 增量加载 ================= */
            .cat-bar {
                display: flex;
                gap: 8px;
                flex-shrink: 0;
            }

            .cat-btn {
                border: none;
                background-color: var(--bg-inactive);
                color: var(--color-secondary);
                font-family: inherit;
                font-size: 13px;
                padding: 5px 16px;
                border-radius: 4px;
                cursor: pointer;
                transition:
                    background-color 0.1s,
                    color 0.1s;
            }

            .cat-btn:hover {
                background-color: var(--bg-inactive-hover);
            }

            .cat-btn.active {
                background-color: var(--color-active);
                color: var(--color-white);
            }

            .load-more {
                flex-shrink: 0;
                text-align: center;
                padding: 10px 0 2px;
            }

            .load-more button {
                border: none;
                background-color: var(--bg-inactive);
                color: var(--color-title);
                font-family: inherit;
                font-size: 13px;
                padding: 7px 34px;
                border-radius: 4px;
                cursor: pointer;
            }

            .load-more button:hover {
                background-color: var(--color-active);
                color: var(--color-white);
            }

            .load-more button:disabled {
                opacity: 0.5;
                cursor: default;
                background-color: var(--bg-inactive);
                color: var(--color-title);
            }

            .track-row.list {
                grid-template-columns: 34px minmax(0, 1fr) auto;
            }

            .col-sub {
                color: var(--color-inactive);
                font-size: 12px;
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
                max-width: 320px;
            }

            /* ================= 歌词窗口化（从当前行渲染 ±7 条，无滚动） ================= */
            .lyrics-content {
                overflow: hidden !important;
                align-items: stretch;
            }

            .lrc-window {
                flex: 1;
                min-height: 0;
                display: flex;
                flex-direction: column;
                justify-content: center;
                overflow: hidden;
                padding: 4px 0;
            }

            .lyric-line {
                position: relative;
                z-index: 1;
                width: 100%;
                height: 52px;
                min-height: 52px;
                margin: 0;
                padding: 0 12px;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                gap: 1px;
                font-size: 17px;
                line-height: 1.25;
                cursor: pointer;
                transition:
                    color 0.2s,
                    font-size 0.2s cubic-bezier(0.1, 0.9, 0.2, 1),
                    opacity 0.3s;
            }

            .lyric-line .lrc-main {
                max-width: 100%;
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
            }

            .lyric-line .lrc-trans {
                font-size: 12px;
                opacity: 0.8;
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
                max-width: 100%;
                margin-top: 0;
            }

            .lyric-line:hover {
                background-color: transparent;
                color: var(--color-title);
            }

            .lyric-line.active {
                background-color: transparent;
                font-size: 22px;
                font-weight: 600;
                color: var(--color-white);
            }

            .lyric-line.active:hover {
                background-color: transparent;
                color: var(--color-white);
            }

            /* ================= 歌单/专辑详情页（参考 my_page_歌单.html） ================= */
            .detail-panel {
                flex: 1;
                min-height: 0;
                display: flex;
                flex-direction: column;
                gap: 14px;
                overflow: hidden;
            }

            .detail-top {
                display: flex;
                align-items: center;
                gap: 12px;
                flex-shrink: 0;
            }

            .detail-title {
                font-size: 15px;
                font-weight: 600;
                color: var(--color-title);
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
            }

            .detail-header {
                display: flex;
                gap: 18px;
                align-items: flex-end;
                flex-shrink: 0;
            }

            .playlist-cover {
                width: 110px;
                height: 110px;
                background-color: var(--bg-inactive);
                border-radius: 4px;
                display: flex;
                align-items: center;
                justify-content: center;
                color: var(--color-inactive);
                flex-shrink: 0;
                overflow: hidden;
            }

            .playlist-cover svg {
                width: 46px;
                height: 46px;
            }

            .playlist-cover img {
                width: 100%;
                height: 100%;
                object-fit: cover;
            }

            .playlist-info {
                display: flex;
                flex-direction: column;
                gap: 10px;
                flex: 1;
                min-width: 0;
            }

            .playlist-title {
                font-size: 20px;
                font-weight: 600;
                color: var(--color-title);
                line-height: 1.25;
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
            }

            .playlist-meta {
                display: flex;
                gap: 14px;
                font-size: 12.5px;
                color: var(--color-inactive);
                flex-wrap: wrap;
            }

            .playlist-actions {
                display: flex;
                gap: 10px;
            }

            .btn-action {
                position: relative;
                height: 34px;
                background-color: var(--bg-inactive);
                border-radius: 4px;
                display: flex;
                align-items: center;
                padding: 0 16px;
                gap: 8px;
                color: var(--color-inactive);
                font-size: 13px;
                font-weight: 500;
                cursor: pointer;
                overflow: hidden;
                border: none;
                font-family: inherit;
            }

            .btn-action svg {
                width: 16px;
                height: 16px;
            }

            .btn-action:hover,
            .btn-action.active {
                background-color: var(--color-active);
                color: var(--color-white);
            }

            .detail-scroll {
                flex: 1;
                min-height: 0;
                overflow-y: auto;
                padding-right: 4px;
                margin-right: -4px;
            }

            .song-item {
                display: flex;
                align-items: center;
                gap: 12px;
                padding: 8px 12px;
                border-radius: 4px;
                cursor: pointer;
                font-size: 13px;
                color: var(--color-inactive);
            }

            .song-item:hover {
                background-color: var(--bg-inactive);
            }

            .song-index {
                width: 34px;
                flex-shrink: 0;
                font-size: 12px;
                color: var(--color-inactive);
                font-variant-numeric: tabular-nums;
                text-align: center;
            }

            .song-name {
                flex: 1;
                font-weight: 500;
                color: var(--color-title);
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
                min-width: 0;
                max-width: 520px;
            }

            .song-item.playing .song-name {
                color: var(--color-active);
            }

            .song-artist-name {
                width: min(22vw, 240px);
                flex-shrink: 0;
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
            }

            .song-duration {
                width: 52px;
                flex-shrink: 0;
                text-align: right;
                font-variant-numeric: tabular-nums;
            }

            /* ================= 搜索单曲行：序号/歌名/歌手/时长，各自限宽不重叠 ================= */
            .track-row.song {
                grid-template-columns:
                    40px minmax(0, 1.5fr) minmax(0, 1fr)
                    54px;
            }

            .track-row .col-index {
                font-variant-numeric: tabular-nums;
            }

            .track-row .col-title {
                max-width: 480px;
            }

            .track-row .col-artist {
                max-width: 320px;
            }

            @media (max-width: 700px) {
                .track-row.song {
                    grid-template-columns:
                        34px minmax(0, 1.6fr) minmax(0, 1fr)
                        44px;
                }
                .track-row .col-title {
                    max-width: none;
                }
                .playlist-cover {
                    width: 80px;
                    height: 80px;
                }
                .song-artist-name {
                    width: 140px;
                }
            }

            /* ================= 歌词行自适应文本宽度 ================= */
            .lrc-window {
                align-items: center;
            }

            .lyric-line {
                width: auto;
                max-width: min(78vw, 640px);
                align-items: center;
            }

            .lyric-line .lrc-main {
                max-width: calc(min(78vw, 640px) - 24px);
            }

            /* ================= 搜索结果内容滑入动画（分类切换不刷新按钮） ================= */
            .list-slide {
                animation: slideInX 0.22s cubic-bezier(0.1, 0.9, 0.2, 1);
            }

            @keyframes slideInX {
                from {
                    opacity: 0;
                    transform: translateX(36px);
                }
                to {
                    opacity: 1;
                    transform: translateX(0);
                }
            }

            /* ================= 收藏视图 ================= */
            .header-bar {
                display: flex;
                align-items: center;
                justify-content: space-between;
                gap: 16px;
                flex-shrink: 0;
            }

            .tab-group {
                display: flex;
                gap: 8px;
            }

            .tab-item {
                height: 34px;
                padding: 0 16px;
                background-color: var(--bg-inactive);
                color: var(--color-inactive);
                border-radius: 4px;
                font-size: 13px;
                font-weight: 500;
                display: flex;
                align-items: center;
                cursor: pointer;
                border: none;
                font-family: inherit;
            }

            .tab-item:hover {
                background-color: var(--bg-inactive-hover);
                color: var(--color-white);
            }

            .tab-item.active {
                background-color: var(--color-active);
                color: var(--color-white);
            }

            .action-group {
                display: flex;
                gap: 8px;
            }

            .fav-panel {
                flex: 1;
                min-height: 0;
                display: flex;
                flex-direction: column;
                gap: 14px;
                overflow: hidden;
            }

            .fav-toolbar {
                display: flex;
                gap: 8px;
                flex-shrink: 0;
            }

            .fav-list {
                flex: 1;
                min-height: 0;
                overflow-y: auto;
                display: flex;
                flex-direction: column;
                gap: 2px;
                padding-right: 4px;
                margin-right: -4px;
            }

            .fav-row {
                display: flex;
                align-items: center;
                gap: 10px;
                padding: 8px 10px;
                border-radius: 4px;
                cursor: pointer;
                font-size: 13px;
                color: var(--color-inactive);
            }

            .fav-row:hover {
                background-color: var(--bg-inactive);
            }

            .fav-row.playing .fav-name {
                color: var(--color-active);
            }

            .fav-check {
                width: 26px;
                height: 26px;
                flex-shrink: 0;
                display: none;
                align-items: center;
                justify-content: center;
                border-radius: 4px;
                color: var(--color-inactive);
            }

            .fav-check svg {
                width: 16px;
                height: 16px;
            }

            .fav-list.batch .fav-check {
                display: flex;
            }

            .fav-row.selected .fav-check {
                background-color: var(--color-active);
                color: var(--color-white);
            }

            .fav-index {
                width: 34px;
                flex-shrink: 0;
                text-align: center;
                font-size: 12px;
                font-variant-numeric: tabular-nums;
            }

            .fav-name {
                flex: 1;
                min-width: 0;
                font-weight: 500;
                color: var(--color-title);
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
            }

            .fav-artist {
                width: min(20vw, 210px);
                flex-shrink: 0;
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
            }

            .fav-album {
                width: min(20vw, 210px);
                flex-shrink: 0;
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
            }

            .fav-duration {
                width: 50px;
                flex-shrink: 0;
                text-align: right;
                font-variant-numeric: tabular-nums;
            }

            .fav-heart {
                width: 28px;
                height: 28px;
                flex-shrink: 0;
                display: flex;
                /* 常驻占位：悬浮只出现图标/背景，不改变布局避免抖动 */
                visibility: hidden;
                align-items: center;
                justify-content: center;
                color: var(--color-inactive);
                border-radius: 4px;
                border: none;
                background: transparent;
                cursor: pointer;
            }

            .fav-heart svg {
                width: 16px;
                height: 16px;
            }

            .fav-row:hover .fav-heart {
                visibility: visible;
            }

            /* 悬浮行时：心形 → dislike（断心），提示点击即取消收藏 */
            .fav-heart .ic-dislike {
                display: none;
            }

            .fav-row:hover .fav-heart .ic-heart {
                display: none;
            }

            .fav-row:hover .fav-heart .ic-dislike {
                display: block;
            }

            .fav-heart:hover {
                background-color: var(--color-active);
                color: var(--color-white);
            }

            .fav-list.batch .fav-heart {
                display: none;
            }

            /* 搜索结果/详情行上的收藏心形按钮 */
            .row-heart {
                width: 26px;
                height: 26px;
                flex-shrink: 0;
                display: none;
                align-items: center;
                justify-content: center;
                color: var(--color-inactive);
                border-radius: 4px;
                border: none;
                background: transparent;
                cursor: pointer;
            }

            .row-heart svg {
                width: 15px;
                height: 15px;
            }

            .row-heart:hover {
                background-color: var(--color-active);
                color: var(--color-white);
            }

            .row-heart.faved {
                display: flex;
                color: var(--color-active);
            }

            .row-heart.faved:hover {
                color: var(--color-white);
            }

            .track-row:hover .row-heart,
            .song-item:hover .row-heart {
                display: flex;
            }

            @media (max-width: 700px) {
                .fav-album {
                    display: none;
                }
                .fav-artist {
                    width: 130px;
                }
            }

            /* 收藏心形按钮叠加在行右侧 */
            .track-row.song,
            .song-item {
                position: relative;
                padding-right: 46px;
            }

            .track-row .row-heart,
            .song-item .row-heart {
                position: absolute;
                right: 10px;
                top: 50%;
                transform: translateY(-50%);
            }

            .detail-panel,
            .fav-panel {
                animation: panelIn 0.2s cubic-bezier(0.1, 0.9, 0.2, 1);
            }

            /* 歌单/专辑详情页保留左侧侧边栏（与收藏/搜索同级），便于随时切换页面 */

            /* 搜索结果中的歌单/专辑行也带收藏心形，避免文字被绝对定位的心形遮住 */
            .track-row.list {
                padding-right: 46px;
            }

            .list-slide-left {
                animation: slideInXl 0.22s cubic-bezier(0.1, 0.9, 0.2, 1);
            }

            @keyframes slideInXl {
                from {
                    opacity: 0;
                    transform: translateX(-36px);
                }
                to {
                    opacity: 1;
                    transform: translateX(0);
                }
            }

            /* ================= 设置视图 ================= */
            .setting-panel {
                flex: 1;
                min-height: 0;
                display: flex;
                flex-direction: column;
                gap: 26px;
                overflow-y: auto;
                padding-right: 6px;
                animation: panelIn 0.2s cubic-bezier(0.1, 0.9, 0.2, 1);
            }

            .setting-section {
                display: flex;
                flex-direction: column;
                gap: 10px;
                flex-shrink: 0;
            }

            .setting-label {
                font-size: 14px;
                font-weight: 500;
                color: var(--color-secondary);
            }

            .setting-desc {
                font-size: 12px;
                color: var(--color-inactive);
                line-height: 1.7;
                user-select: text;
            }

            .setting-options {
                display: flex;
                flex-wrap: wrap;
                gap: 8px;
            }

            .opt-pill {
                border: none;
                background-color: var(--bg-inactive);
                color: var(--color-secondary);
                font-family: inherit;
                font-size: 13px;
                padding: 6px 14px;
                border-radius: 4px;
                cursor: pointer;
                transition:
                    background-color 0.1s,
                    color 0.1s;
            }

            .opt-pill:hover {
                background-color: var(--bg-inactive-hover);
            }

            .opt-pill.active {
                background-color: var(--color-active);
                color: var(--color-white);
            }
        </style>
    </head>
    <body>
        <div class="stage">
            <div class="app-container">

                                />

                            <div class="label">搜索</div>

                    </div>

                    <div class="nav-item" id="navFav" title="收藏">

                        <div class="icon-box">

                                    d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"

                        <div class="indicator"></div>
                        <div class="icon-box">

                                <path
                                    d="M11.3807 2.01886C9.91573 3.38768 9 5.3369 9 7.49999C9 11.6421 12.3579 15 16.5 15C18.6631 15 20.6123 14.0843 21.9811 12.6193C21.6613 17.8537 17.3149 22 12 22C6.47715 22 2 17.5228 2 12C2 6.68514 6.14629 2.33869 11.3807 2.01886Z"

                                    d="M9.95401 2.2106C11.2876 1.93144 12.6807 1.92263 14.0449 2.20785C14.2219 3.3674 14.9048 4.43892 15.9997 5.07103C17.0945 5.70313 18.364 5.75884 19.4566 5.3323C20.3858 6.37118 21.0747 7.58203 21.4997 8.87652C20.5852 9.60958 19.9997 10.736 19.9997 11.9992C19.9997 13.2632 20.5859 14.3902 21.5013 15.1232C21.29 15.7636 21.0104 16.3922 20.6599 16.9992C20.3094 17.6063 19.9049 18.1627 19.4559 18.6659C18.3634 18.2396 17.0943 18.2955 15.9997 18.9274C14.9057 19.559 14.223 20.6294 14.0453 21.7879C12.7118 22.067 11.3187 22.0758 9.95443 21.7906C9.77748 20.6311 9.09451 19.5595 7.99967 18.9274C6.90484 18.2953 5.63539 18.2396 4.54272 18.6662C3.61357 17.6273 2.92466 16.4164 2.49964 15.1219C3.41412 14.3889 3.99968 13.2624 3.99968 11.9992C3.99968 10.7353 3.41344 9.60827 2.49805 8.87524C2.70933 8.23482 2.98894 7.60629 3.33942 6.99923C3.68991 6.39217 4.09443 5.83576 4.54341 5.33257C5.63593 5.75881 6.90507 5.703 7.99967 5.07103C9.09364 4.43942 9.7764 3.3691 9.95401 2.2106ZM11.9997 14.9992C13.6565 14.9992 14.9997 13.6561 14.9997 11.9992C14.9997 10.3424 13.6565 8.99923 11.9997 8.99923C10.3428 8.99923 8.99967 10.3424 8.99967 11.9992C8.99967 13.6561 10.3428 14.9992 11.9997 14.9992Z"
                                />

                        </div>

                            <div class="label">设置</div>
                        </div>
                    </div>
                </div>

                <!-- 主视图（搜索 / 结果） -->
                <div class="main-content">
                    <div class="search-bar" id="searchBar">
                        <svg viewBox="0 0 24 24">
                            <path
                                d="M18.031 16.6168L22.3137 20.8995L20.8995 22.3137L16.6168 18.031C15.0769 19.263 13.124 20 11 20C6.032 20 2 15.968 2 11C2 6.032 6.032 2 11 2C15.968 2 20 6.032 20 11C20 13.124 19.263 15.0769 18.031 16.6168ZM16.0247 15.8748C17.2475 14.6146 18 12.8956 18 11C18 7.1325 14.8675 4 11 4C7.1325 4 4 7.1325 4 11C4 14.8675 7.1325 18 11 18C12.8956 18 14.6146 17.2475 15.8748 16.0247L16.0247 15.8748Z"
                            />
                        </svg>
                        <input
                            type="text"
                            id="searchInput"
                            placeholder="搜索歌曲、歌手、歌词..."
                        />
                        <button
                            class="clear-btn hidden"
                            id="searchClear"
                            title="清空"
                            type="button"
                        >
                            <svg viewBox="0 0 24 24">
                                <path
                                    d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"
                                />
                            </svg>
                        </button>
                        <button class="search-btn" id="searchBtn" type="button">
                            搜索
                        </button>
                    </div>

                    <div class="browse-area" id="browseArea">
                        <div class="section-head">
                            <div class="section-title">历史搜索</div>
                            <button
                                class="hist-clear hidden"
                                id="histClear"
                                type="button"
                            >
                                清空
                            </button>
                        </div>
                        <div class="tag-list" id="histList"></div>
                        <div class="hist-empty hidden" id="histEmpty">
                            暂无搜索历史
                        </div>
                    </div>

                    <div class="result-panel hidden" id="resultPanel">
                        <div class="cat-bar" id="catBar">
                            <div class="tab-item active" data-cat="song">单曲</div>
                            <div class="tab-item" data-cat="playlist">歌单</div>
                            <div class="tab-item" data-cat="album">专辑</div>
                        </div>
                        <div class="list-scroll" id="trackList"></div>
                        <div class="empty-state hidden" id="empty">
                            <svg viewBox="0 0 24 24">
                                <path
                                    d="M12 13.5351V3H20V6H14V17C14 19.2091 12.2091 21 10 21C7.79086 21 6 19.2091 6 17C6 14.7909 7.79086 13 10 13C10.7286 13 11.4117 13.1948 12 13.5351Z"
                                />
                            </svg>
                            <div class="empty-title" id="emptyTitle"></div>
                            <div class="empty-sub" id="emptySub"></div>
                        </div>
                    </div>

                    <div class="detail-panel hidden" id="detailPanel">
                        <div class="detail-top">
                            <button
                                class="btn-square"
                                id="detailBack"
                                type="button"
                                title="返回"
                            >
                                <svg viewBox="0 0 24 24">
                                    <path
                                        d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"
                                    />
                                </svg>
                            </button>
                            <div class="detail-title" id="detailTitle"></div>
                        </div>
                        <div class="detail-header">
                            <div class="playlist-cover" id="detailCover">
                                <svg viewBox="0 0 24 24">
                                    <path
                                        d="M12 13.5351V3H20V6H14V17C14 19.2091 12.2091 21 10 21C7.79086 21 6 19.2091 6 17C6 14.7909 7.79086 13 10 13C10.7286 13 11.4117 13.1948 12 13.5351Z"
                                    />
                                </svg>
                            </div>
                            <div class="playlist-info">
                                <div
                                    class="playlist-title"
                                    id="detailName"
                                ></div>
                                <div
                                    class="playlist-meta"
                                    id="detailMeta"
                                ></div>
                                <div class="playlist-actions">
                                    <button
                                        class="btn-action active"
                                        id="detailPlayAll"
                                        type="button"
                                    >
                                        <svg viewBox="0 0 24 24">
                                            <path d="M8 5v14l11-7z" />
                                        </svg>
                                        <span>播放全部</span>
                                    </button>
                                    <button
                                        class="btn-action"
                                        id="detailFav"
                                        type="button"
                                    >
                                        <svg viewBox="0 0 24 24">
                                            <path
                                                d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"
                                            />
                                        </svg>
                                        <span id="detailFavText">收藏歌单</span>
                                    </button>
                                </div>
                            </div>
                        </div>
                        <div class="detail-scroll" id="detailList"></div>
                    </div>

                    <!-- 收藏视图 -->
                    <div class="fav-panel hidden" id="favPanel">
                        <div class="header-bar">
                            <div class="tab-group">
                                <div class="tab-item active" data-favtab="song">
                                    单曲 (<span id="favCount">0</span>)
                                </div>
                                <div class="tab-item" data-favtab="playlist">
                                    歌单 (<span id="favPlaylistCount">0</span>)
                                </div>
                                <div class="tab-item" data-favtab="album">
                                    专辑 (<span id="favAlbumCount">0</span>)
                                </div>
                            </div>
                            <div class="action-group">
                                <button
                                    class="btn-action"
                                    id="favManage"
                                    type="button"
                                >
                                    <svg viewBox="0 0 24 24">
                                        <path
                                            d="M3 13h2v-2H3v2zm0 4h2v-2H3v2zm0-8h2V7H3v2zm4 4h14v-2H7v2zm0 4h14v-2H7v2zM7 7v2h14V7H7z"
                                        />

                                </button>
                            </div>
                        </div>
                        <div class="fav-toolbar hidden" id="favToolbar">
                            <button
                                class="btn-action active"
                                id="favSelectAll"

                                全选

                                class="btn-action active"
                                id="favPlaySel"
                                type="button"
                            >
                                <svg viewBox="0 0 24 24">
                                    <path d="M8 5v14l11-7z" />
                                </svg>
                                <span>播放选中</span>
                            </button>
                            <button
                                class="btn-action"
                                id="favRemoveSel"
                                type="button"
                            >
                                移除选中
                            </button>
                            <button
                                class="btn-action"
                                id="favDone"
                                type="button"
                            >
                                完成
                            </button>
                        </div>
                        <div class="fav-list" id="favList"></div>
                        <div class="empty-state hidden" id="favEmpty">
                            <svg viewBox="0 0 24 24">
                                <path
                                    d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"
                                />
                            </svg>
                            <div class="empty-title">还没有收藏的歌曲</div>
                            <div class="empty-sub">

                            </div>
                        </div>
                    </div>
                    <div class="setting-panel hidden" id="settingsPanel">
                        <div class="setting-section">
                            <div class="setting-label">歌曲音质</div>
                            <div class="setting-options" id="setQualityOpts">
                                <button class="opt-pill" type="button" data-q="standard">标准</button>
                                <button class="opt-pill" type="button" data-q="higher">较高</button>
                                <button class="opt-pill" type="button" data-q="exhigh">极高</button>
                            </div>
                            <div class="setting-desc">
                                切换后对之后播放的歌曲生效。
                            </div>
                        </div>
                        <div class="setting-section">
                            <div class="setting-label">歌曲缓冲区大小</div>
                            <div class="setting-options" id="setBufferOpts">
                                <button class="opt-pill" type="button" data-mb="256">256 MB</button>
                                <button class="opt-pill" type="button" data-mb="512">512 MB</button>
                                <button class="opt-pill" type="button" data-mb="1024">1 GB</button>
                                <button class="opt-pill" type="button" data-mb="2048">2 GB</button>
                            </div>
                            <div class="setting-desc">
                                歌曲缓冲（临时缓存）大小上限，超出后自动清理最旧的缓冲文件。
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 歌词全屏覆盖层 -->
            <div class="lyrics-page collapsed" id="lyricsPage">
                <div class="top-bar">
                    <div class="btn-square" id="lyricCollapse" title="收起歌词">
                        <svg viewBox="0 0 24 24">
                            <path

                        </svg>
                    </div>
                    <div class="btn-square" id="lyricTheme" title="明暗切换">
                        <svg id="lyricThemeIcon" viewBox="0 0 24 24">
                            <path
                                d="M11.3807 2.01886C9.91573 3.38768 9 5.3369 9 7.49999C9 11.6421 12.3579 15 16.5 15C18.6631 15 20.6123 14.0843 21.9811 12.6193C21.6613 17.8537 17.3149 22 12 22C6.47715 22 2 17.5228 2 12C2 6.68514 6.14629 2.33869 11.3807 2.01886Z"
                            />
                        </svg>
                    </div>
                </div>

                <div class="lyrics-content" id="lyricsScroll"></div>
            </div>
        </div>

        <!-- 底部播放控制栏 -->
        <div class="player-bar" id="playerBar">
            <div class="progress-container" id="progressContainer">
                <div class="progress-track" id="progressTrack">
                    <div class="progress-fill" id="progressFill"></div>
                    <div class="progress-handle" id="progressHandle"></div>
                </div>
                <div class="progress-tip" id="progressTip"></div>
            </div>

            <div class="controls-container">
                <div class="left-info">
                    <div class="song-info-btn" id="songBtn">
                        <div class="song-cover" id="coverBox">
                            <svg id="coverIcon" viewBox="0 0 24 24">
                                <path
                                    d="M12 13.5351V3H20V6H14V17C14 19.2091 12.2091 21 10 21C7.79086 21 6 19.2091 6 17C6 14.7909 7.79086 13 10 13C10.7286 13 11.4117 13.1948 12 13.5351Z"
                                />

                            <img id="coverImg" class="hidden" alt="" />
                        </div>
                        <div class="song-detail">
                            <div class="song-title" id="songTitle">
                                未在播放
                            </div>
                            <div class="song-artist" id="songArtist">
                                搜索并点击歌曲开始播放
                            </div>
                        </div>
                    </div>
                </div>

                <div class="center-controls">
                    <div
                        class="btn-square"
                        id="modeBtn"
                        title="播放顺序：顺序播放"
